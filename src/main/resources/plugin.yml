name: DuskRankColors
version: '${version}'
main: dev.dusk.rankcolors.DuskRankColorsPlugin
api-version: '1.20'
folia-supported: true
authors: [isylxnt]
description: Lightweight independent rank, plus and name colors.
softdepend: [PlaceholderAPI]
commands:
  rankcolors:
    description: Opens DuskRankColors; administration is under /drc admin.
    usage: /rankcolors
    aliases: [rc, drc, rankcolor]
permissions:
  duskrankcolors.use:
    default: false
    children:
      duskrankcolors.gui: true
  duskrankcolors.gui:
    default: false
  duskrankcolors.rank:
    default: true
  duskrankcolors.plus:
    default: true
  duskrankcolors.name:
    default: true
  duskrankcolors.rank.rgb:
    default: op
  duskrankcolors.plus.rgb:
    default: op
  duskrankcolors.name.rgb:
    default: op
  duskrankcolors.rank.gradient:
    default: op
  duskrankcolors.plus.gradient:
    default: op
  duskrankcolors.name.gradient:
    default: op
  duskrankcolors.admin:
    default: op
    children:
      duskrankcolors.admin.reload: true
      duskrankcolors.admin.set: true
      duskrankcolors.admin.reset: true
      duskrankcolors.admin.info: true
      duskrankcolors.admin.rgb: true
      duskrankcolors.admin.gradient: true
      duskrankcolors.admin.inspect: true
      duskrankcolors.admin.validate: true
  duskrankcolors.admin.reload:
    default: op
  duskrankcolors.admin.set:
    default: op
  duskrankcolors.admin.reset:
    default: op
  duskrankcolors.admin.info:
    default: op
  duskrankcolors.admin.rgb:
    default: op
  duskrankcolors.admin.gradient:
    default: op
  duskrankcolors.admin.inspect:
    default: op
  duskrankcolors.admin.validate:
    default: op
