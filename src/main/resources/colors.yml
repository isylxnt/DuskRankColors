# DuskRankColors preset colors
#
# Add, remove or reorder entries in this file to change the preset menu.
# IDs are case-insensitive and should not contain spaces. Players store the ID,
# so changing a HEX value updates everyone using that preset after a plugin reload.
#
# Entry reference:
#   enabled:      false hides the preset without deleting its configuration.
#   display-name: item name shown in the menu; legacy & color codes are supported.
#   hex:          exact color used by Adventure components. Format: "#RRGGBB".
#   legacy:       fallback code for plugins that only support classic colors.
#   material:     Bukkit Material name used by the preset item.
#   allowed:      categories where this preset may be selected.
#   permissions:  optional custom permission for each category.
#
# When `allowed` is omitted, the preset is allowed for rank, plus and name.
# When `permissions` is omitted, the automatic node is:
# duskrankcolors.<category>.<preset-id>
# Example: duskrankcolors.name.orange
colors:
  orange:
    # This first entry contains every available option and can be copied as a template.
    enabled: true
    display-name: "&6Orange"
    hex: "#FFB224"
    legacy: "&6"
    material: ORANGE_DYE
    allowed: { rank: true, plus: true, name: true }
    permissions:
      rank: "duskrankcolors.rank.orange"
      plus: "duskrankcolors.plus.orange"
      name: "duskrankcolors.name.orange"
  yellow:
    # The omitted permissions use duskrankcolors.rank.yellow, plus.yellow and name.yellow.
    enabled: true
    display-name: "&eYellow"
    hex: "#FAD763"
    legacy: "&e"
    material: YELLOW_DYE
    allowed: { rank: true, plus: true, name: true }
  gray:
    enabled: true
    display-name: "&7Gray"
    hex: "#C1BEB3"
    legacy: "&7"
    material: GRAY_DYE
  dark_red:
    enabled: true
    display-name: "&4Dark Red"
    hex: "#FF2E43"
    legacy: "&4"
    material: RED_DYE
  red:
    enabled: true
    display-name: "&cRed"
    hex: "#FC5464"
    legacy: "&c"
    material: RED_DYE
  dark_green:
    enabled: true
    display-name: "&2Dark Green"
    hex: "#2BB70C"
    legacy: "&2"
    material: GREEN_DYE
  lime:
    enabled: true
    display-name: "&aLime"
    hex: "#71DD2F"
    legacy: "&a"
    material: LIME_DYE
  light_lime:
    enabled: true
    display-name: "&aLight Lime"
    hex: "#9AEC69"
    legacy: "&a"
    material: LIME_DYE
  pink:
    enabled: true
    display-name: "&dPink"
    hex: "#FF55FF"
    legacy: "&d"
    material: PINK_DYE
  aqua:
    enabled: true
    display-name: "&bAqua"
    hex: "#55FFFF"
    legacy: "&b"
    material: LIGHT_BLUE_DYE
  blue:
    enabled: true
    display-name: "&9Blue"
    hex: "#5555FF"
    legacy: "&9"
    material: BLUE_DYE
  white:
    enabled: true
    display-name: "&fWhite"
    hex: "#FFFFFF"
    legacy: "&f"
    material: WHITE_DYE

